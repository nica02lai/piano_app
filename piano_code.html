<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piano Code Training</title>
    <style>
        /* 全体のレイアウト設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a; /* 目に優しい暗めの背景 */
            font-family: Arial, sans-serif;
            color: white;
        }

        /* 画面を4分割するコンテナ */
        .container {
            display: flex;
            width: 100vw;
            height: 80vh; /* 上部8割をコード表示に */
        }

        .code-slot {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15vw; /* 画面幅に合わせた巨大フォント */
            font-weight: bold;
            border-right: 2px solid #333;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .code-slot:last-child {
            border-right: none;
        }

        /* 操作パネル（下部） */
        .controls {
            width: 100vw;
            height: 20vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #222;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px #2e7d32;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px #2e7d32;
        }

        /* 横向きを推奨するメッセージ（縦向きの時だけ表示） */
        @media screen and (orientation: portrait) {
            .portrait-warning {
                display: flex;
            }
        }
        .portrait-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="portrait-warning">
        画面を横向きにして練習してください
    </div>

    <div class="container">
        <div id="slot1" class="code-slot">-</div>
        <div id="slot2" class="code-slot">-</div>
        <div id="slot3" class="code-slot">-</div>
        <div id="slot4" class="code-slot">-</div>
    </div>

    <div class="controls">
        <button onclick="shuffle()">SHUFFLE</button>
    </div>

    <script>
        // 練習したいコードのリスト（自由に追加・削除してください）
        const chords = [
            'C', 'D', 'E', 'F', 'G', 'A', 'B',
            'Cm', 'Dm', 'Em', 'Fm', 'Gm', 'Am', 'Bm',
            'C7', 'D7', 'E7', 'F7', 'G7', 'A7', 'B7',
            'CM7', 'DM7', 'EM7', 'FM7', 'GM7', 'AM7', 'BM7'
        ];

        function shuffle() {
            // 配列をランダムに並び替える
            const shuffled = [...chords].sort(() => 0.5 - Math.random());
            
            // 4つのスロットに代入
            document.getElementById('slot1').innerText = shuffled[0];
            document.getElementById('slot2').innerText = shuffled[1];
            document.getElementById('slot3').innerText = shuffled[2];
            document.getElementById('slot4').innerText = shuffled[3];
        }

        // 初回起動時にも実行
        shuffle();
    </script>
</body>
</html>
