<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7th Chord Deck Training</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a1a1a;
            font-family: 'Arial', sans-serif; color: white;
        }
        .container { display: flex; width: 100vw; height: 80vh; }
        .code-slot {
            flex: 1; display: flex; align-items: center; justify-content: center;
            border-right: 2px solid #333;
        }
        .code-slot:last-child { border-right: none; }
        .chord-name { font-size: 10vw; font-weight: bold; }
        
        .controls {
            width: 100vw; height: 20vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #222;
        }
        button {
            padding: 12px 40px; font-size: 1.5rem;
            cursor: pointer; background-color: #2196F3;
            color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px #1976D2;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px #1976D2; }
        .status { font-size: 0.9rem; color: #888; margin-top: 10px; }

        @media screen and (orientation: portrait) {
            .portrait-warning { display: flex; }
        }
        .portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body>

    <div class="portrait-warning">画面を横向きにしてください</div>

    <div class="container">
        <div id="slot0" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot1" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot2" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot3" class="code-slot"><span class="chord-name">-</span></div>
    </div>

    <div class="controls">
        <button onclick="draw()">NEXT 4 CHORDS</button>
        <div id="status" class="status">残りのカード: 48/48</div>
    </div>

    <script>
        const roots = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const types = ['M7', 'm7', '7', 'm7b5'];
        let deck = [];

        // 山札（48枚）を作成してシャッフルする関数
        function createDeck() {
            let newDeck = [];
            roots.forEach(root => {
                types.forEach(type => {
                    newDeck.push(root + type);
                });
            });
            // フィッシャー・イェーツのシャッフル
            for (let i = newDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
            }
            return newDeck;
        }

        function draw() {
            // 山札が足りなくなったら新しく作り直す
            if (deck.length < 4) {
                deck = createDeck();
            }

            // 山札から4枚引く
            for (let i = 0; i < 4; i++) {
                const chord = deck.shift(); // 先頭から取り出す
                document.getElementById('slot' + i).innerHTML = `<span class="chord-name">${chord}</span>`;
            }

            // 残り枚数を表示
            document.getElementById('status').innerText = `残りのカード: ${deck.length}/48`;
        }

        // 最初のセットを表示
        deck = createDeck();
        draw();
    </script>
</body>
</html>
