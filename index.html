<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7th Chord Master</title>
    <style>
        /* 1. すべての要素ではみ出し計算を防止 */
        * {
            box-sizing: border-box; 
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a1a1a;
            font-family: 'Arial', sans-serif; color: white;
        }

        .container {
            display: flex;
            width: 100vw;
            height: 80vh;
            border: 2px solid #333; /* 外枠 */
        }

        .code-slot {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #333;
            overflow: hidden; /* はみ出た文字を隠す */
            padding: 5px;
        }

        .code-slot:last-child {
            border-right: none;
        }

        .chord-name {
            /* 2. 文字サイズを少し控えめに（8vw前後が安全） */
            font-size: 8vw; 
            font-weight: bold;
            white-space: nowrap; /* 改行させない */
            text-align: center;
        }

        .controls {
            width: 100vw; height: 20vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-color: #222;
        }

        button {
            padding: 12px 40px; font-size: 1.5rem;
            cursor: pointer; background-color: #2196F3;
            color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px #1976D2;
        }

        button:active { transform: translateY(2px); box-shadow: 0 2px #1976D2; }

        .status { font-size: 0.8rem; color: #888; margin-top: 5px; }

        @media screen and (orientation: portrait) {
            .portrait-warning { display: flex; }
        }
        .portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body>
    <!-- 中身（HTMLとScript）は前回と同じで大丈夫です -->
    <div class="portrait-warning">画面を横向きにしてください</div>
    <div class="container">
        <div id="slot0" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot1" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot2" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot3" class="code-slot"><span class="chord-name">-</span></div>
    </div>
    <div class="controls">
        <button onclick="draw()">NEXT 4 CHORDS</button>
        <div id="status" class="status">残りのカード: 48/48</div>
    </div>

    <script>
        const roots = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const types = ['M7', 'm7', '7', 'm7b5'];
        let deck = [];

        function createDeck() {
            let newDeck = [];
            roots.forEach(root => {
                types.forEach(type => { newDeck.push(root + type); });
            });
            for (let i = newDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
            }
            return newDeck;
        }

        function draw() {
            if (deck.length < 4) { deck = createDeck(); }
            for (let i = 0; i < 4; i++) {
                const chord = deck.shift();
                document.getElementById('slot' + i).querySelector('.chord-name').innerText = chord;
            }
            document.getElementById('status').innerText = `残りのカード: ${deck.length}/48`;
        }
        deck = createDeck();
        draw();
    </script>
</body>
</html>
