<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Master Pro</title>
    <style>
        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a1a1a;
            font-family: 'Arial', sans-serif; color: white;
        }

        /* 上部のコード表示エリア */
        .container {
            display: flex;
            width: 100vw;
            height: 65vh; /* 操作エリアを少し広げました */
            border-bottom: 2px solid #333;
        }

        .code-slot {
            width: 25%; flex: 0 0 25%; 
            display: flex; align-items: center; justify-content: center;
            border-right: 2px solid #333; background-color: #1a1a1a;
        }
        .code-slot:last-child { border-right: none; }

        .chord-name { font-size: 6vw; font-weight: bold; white-space: nowrap; }

        /* 下部の操作エリア */
        .controls {
            width: 100vw; height: 35vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-evenly;
            background-color: #222;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* モード切替ボタン群 */
        .mode-switch {
            display: flex; gap: 15px;
        }
        .mode-btn {
            padding: 10px 20px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; background-color: #444; color: #888;
            border: 2px solid #333; border-radius: 8px; transition: 0.2s;
        }
        .mode-btn.active {
            background-color: #E91E63; color: white; border-color: #E91E63;
            box-shadow: 0 0 10px rgba(233, 30, 99, 0.5);
        }

        .status { font-size: 1.2rem; color: #FFC107; font-weight: bold; }

        .main-btn {
            padding: 15px 80px; font-size: 1.8rem; font-weight: bold;
            cursor: pointer; background-color: #2196F3; color: white;
            border: none; border-radius: 50px; box-shadow: 0 5px #1976D2;
        }
        .main-btn:active { transform: translateY(4px); box-shadow: 0 1px #1976D2; }

        @media screen and (orientation: portrait) {
            .portrait-warning { display: flex; }
        }
        .portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body>

    <div class="portrait-warning">画面を横向きにしてください</div>

    <div class="container">
        <div id="slot0" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot1" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot2" class="code-slot"><span class="chord-name">-</span></div>
        <div id="slot3" class="code-slot"><span class="chord-name">-</span></div>
    </div>

    <div class="controls">
        <div class="mode-switch">
            <button id="btn-random" class="mode-btn active" onclick="setMode('random')">ランダムモード</button>
            <button id="btn-prog" class="mode-btn" onclick="setMode('progression')">コード進行モード</button>
        </div>
        
        <div id="status" class="status">残りのカード: 48/48</div>
        
        <button class="main-btn" onclick="draw()">NEXT</button>
    </div>

    <script>
        const roots = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const types = ['M7', 'm7', '7', 'm7b5'];
        let deck = [];
        let currentMode = 'random'; // 'random' または 'progression'

        // --- ランダムモード用の関数 ---
        function createDeck() {
            let newDeck = [];
            roots.forEach(root => { types.forEach(type => { newDeck.push(root + type); }); });
            for (let i = newDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
            }
            return newDeck;
        }

        // --- コード進行モード用の定義 ---
        // intervals はルート音からの半音の距離 (0=I, 2=II, 4=III, 5=IV, 7=V, 9=VI, 11=VII)
        const progPatterns = [
            { name: "Major II-V-I", intervals: [2, 7, 0, 0], pTypes: ['m7', '7', 'M7', 'M7'] },
            { name: "Minor II-V-I", intervals: [11, 4, 9, 9], pTypes: ['m7b5', '7', 'm7', 'm7'] }, // Target=VIm
            { name: "循環 1-6-2-5", intervals: [0, 9, 2, 7], pTypes: ['M7', 'm7', 'm7', '7'] },
            { name: "Turnaround 3-6-2-5", intervals: [4, 9, 2, 7], pTypes: ['m7', '7', 'm7', '7'] },
            { name: "Subdominant Minor", intervals: [5, 5, 0, 0], pTypes: ['M7', 'm7', 'M7', 'M7'] },
            { name: "Jazz Blues", intervals: [0, 5, 0, 7], pTypes: ['7', '7', '7', '7'] }
        ];

        // --- モード切替 ---
        function setMode(mode) {
            currentMode = mode;
            // ボタンの見た目変更
            document.getElementById('btn-random').classList.remove('active');
            document.getElementById('btn-prog').classList.remove('active');
            if (mode === 'random') document.getElementById('btn-random').classList.add('active');
            if (mode === 'progression') document.getElementById('btn-prog').classList.add('active');
            // 切り替えたらすぐに表示を更新
            draw();
        }

        // --- メイン描画処理 ---
        function draw() {
            if (currentMode === 'random') {
                if (deck.length < 4) deck = createDeck();
                for (let i = 0; i < 4; i++) {
                    document.getElementById('slot' + i).querySelector('.chord-name').innerText = deck.shift();
                }
                document.getElementById('status').innerText = `残りのカード: ${deck.length}/48`;
                document.getElementById('status').style.color = '#888';
            } 
            else if (currentMode === 'progression') {
                // キー（CやFなど）をランダムに決定
                const keyIndex = Math.floor(Math.random() * 12);
                const keyName = roots[keyIndex];
                // 進行パターンをランダムに決定
                const pattern = progPatterns[Math.floor(Math.random() * progPatterns.length)];
                
                for (let i = 0; i < 4; i++) {
                    // キーのルート音からの距離を足して、度数のルート音を求める
                    const rootIndex = (keyIndex + pattern.intervals[i]) % 12;
                    const chord = roots[rootIndex] + pattern.pTypes[i];
                    document.getElementById('slot' + i).querySelector('.chord-name').innerText = chord;
                }
                // なんの練習をしているか分かりやすく表示
                document.getElementById('status').innerText = `Key: ${keyName} (${pattern.name})`;
                document.getElementById('status').style.color = '#FFC107'; // 見やすく黄色に
            }
        }

        // 初回起動時
        deck = createDeck();
        draw();
    </script>
</body>
</html>
